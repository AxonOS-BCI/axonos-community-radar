name: CI

# Six independent gates. Every push to main must turn the whole wall green —
# the checks page IS the quality statement for this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    name: Data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: JSON is valid
        run: |
          python3 -c "import json;json.load(open('data/seeds.json'));print('seeds.json ok')"
          python3 -c "import json;json.load(open('data/radar.json'));print('radar.json ok')"

      - name: Validate published radar.json
        run: python3 scripts/validate_payload.py data/radar.json

      - name: weekly.json deltas are plausible
        # A delta computed across a composition seam once put "Stars −551 183"
        # on the live digest with a straight face. The engine now refuses to
        # cross that seam (baseline_reset); this is the independent net.
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open("data/weekly.json", encoding="utf-8"))
          now, delta = w.get("now", {}), w.get("delta", {})
          if w.get("baseline_reset"):
              assert all(v == 0 for v in delta.values()), "reset digest must carry zero deltas"
              print("weekly: baseline_reset — zero deltas, honest")
          else:
              for k, dv in delta.items():
                  base = now.get(k)
                  if isinstance(base, (int, float)) and isinstance(dv, (int, float)):
                      assert abs(dv) <= max(abs(base) * 10, 1000), \
                          f"weekly delta {k}={dv} implausible vs now={base}"
              print("weekly deltas plausible")
          PY

      - name: report.html renders the current payload and leaks no engine links
        # The report is rendered and published by the ENGINE, a separate
        # repository with its own version file, every three hours. This gate
        # used to require the report to name *this* repository's release, which
        # could not hold: a correct release here was overwritten by the next
        # scan with a report stamped at the engine's version, and this gate then
        # failed on the file the release had just fixed.
        #
        # There is one product and one version of it, and it is this one. The
        # report no longer claims to carry it; it carries the identity of the
        # snapshot it renders, derived from the payload on the page. That is
        # what check_report.py verifies, along with the property that was always
        # the real point: no link into the private engine.
        run: python3 scripts/check_report.py

      - name: Validate history.json
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open("data/history.json", encoding="utf-8"))
          assert h.get("version") == 1, "history version"
          assert isinstance(h.get("snapshots"), list), "snapshots list"
          for s in h["snapshots"]:
              assert isinstance(s.get("snapshot_at"), str)
              assert isinstance(s.get("stars"), dict) and len(s["stars"]) <= 200
              assert all(isinstance(v, int) and v >= 0 for v in s["stars"].values())
          print("history.json ok")
          PY

      - name: Schema validation
        # Every dataset that ships a schema file must be checked against it here —
        # a schema that only ever gets *pointed to* (by build_api_index.py) and
        # never actually enforced is a promise CI cannot back up.
        run: |
          pip install -r requirements-ci.txt --quiet
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('data/radar.json')), json.load(open('data/radar.schema.json'))); print('radar.json schema ok')"
          if [ -f data/trajectory.json ] && [ -f data/trajectory.schema.json ]; then
            python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('data/trajectory.json')), json.load(open('data/trajectory.schema.json'))); print('trajectory.json schema ok')"
          else
            echo "trajectory.json or its schema not present yet — skip (not an error pre-publish)"
          fi

      - name: Build and validate deploy-time-only datasets
        # signals.json never exists in the checkout (build_signals.py's own
        # docstring: "Deploy-time and pure ... commits nothing") — a check
        # that only looks for a pre-existing data/signals.json always skips
        # and never actually enforces anything. Build it the same way the
        # real deploy does, then validate that real output.
        run: |
          python3 scripts/build_signals.py --out /tmp/_site_check --radar data/radar.json --first-seen data/first_seen.json
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('/tmp/_site_check/data/signals.json')), json.load(open('data/signals.schema.json'))); print('signals.json (built fresh, same as deploy) schema ok')"

      - name: Feed is well-formed
        run: python3 -c "import xml.dom.minidom as m;m.parse('feed.xml');print('feed.xml ok')"

      - name: first_seen sanity (no future timestamps)
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).isoformat()
          fs = json.load(open("data/first_seen.json", encoding="utf-8"))
          bad = [k for k, v in fs.items() if isinstance(v, str) and v > now]
          assert not bad, f"future first_seen: {bad[:5]}"
          print(f"first_seen ok ({len(fs)} entries, none in the future)")
          PY

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Python syntax
        run: python3 -m py_compile scripts/validate_payload.py scripts/publish_stats_issue.py scripts/health_check.py scripts/build_ecosystem_manifest.py scripts/build_exports.py scripts/build_signals.py scripts/build_api_index.py scripts/build_badges.py scripts/sync_engine_data.py scripts/interop.py scripts/check_methodology.py scripts/build_trajectory.py scripts/build_talent.py scripts/check_provenance.py

      - name: Unit tests
        run: |
          pip install -r requirements-ci.txt --quiet
          python3 -m pytest tests/ -q

      - name: Documentation-coverage gate (v6)
        # Every shipped signal, interop tag and endpoint must be explained in
        # the Methodology view and docs/METHODOLOGY.md, and every tag must
        # exist in the UI label map. A signal without its explanation fails CI.
        run: python3 scripts/check_methodology.py

      - name: Interop vocabulary self-check
        run: python3 scripts/interop.py

  frontend:
    name: Frontend integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: HTML integrity + strict CSP
        run: |
          grep -qi '<!doctype html>' index.html
          grep -q '<canvas id="radar"' index.html
          grep -q "'./data/radar.json'" assets/app.js
          grep -q 'og:image' index.html
          grep -q 'function safeUrl' assets/app.js
          for f in index.html stats.html report.html; do grep -q "script-src 'self';" "$f" && grep -q "style-src 'self';" "$f" && ! grep -q "unsafe-inline" "$f" || { echo "CSP not strict: $f"; exit 1; }; done
          echo "strict CSP (no unsafe-inline) ok"

      - name: stats page integrity
        run: |
          for s in 'Content-Security-Policy' 'id="growth"'; do grep -q "$s" stats.html || { echo "stats.html missing: $s"; exit 1; }; done
          grep -q 'function safeUrl' assets/stats.js && grep -q "'./data/radar.json'" assets/stats.js || { echo "stats.js missing safeUrl/data"; exit 1; }
          echo "stats ok"

      - name: JS syntax
        run: |
          node --check assets/app.js
          node --check assets/stats.js

      - name: Functional UI smoke (jsdom)
        run: |
          npm install --no-save --silent jsdom@26
          node tests/ui_smoke.mjs

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Secret scan
        run: |
          if grep -rEn --exclude-dir=node_modules 'ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' --include='*.py' --include='*.html' --include='*.md' --include='*.json' .; then
            echo "potential secret found"; exit 1
          fi
          echo "no secrets"

      - name: SAST (bandit)
        run: |
          pip install -r requirements-ci.txt --quiet
          # Skips are deliberate design, each reviewed in docs/THREAT_MODEL.md:
          #   B101 assert            — validate() gates data with asserts, CI-enforced
          #   B110/B112 try/except   — resilience: a bad snapshot/entry must never kill the pipeline
          #   B310 urllib.urlopen    — every URL is allowlisted (api.github.com / *.github.io)
          #   B406 xml.sax escape    — used to ESCAPE output for the RSS feed, never to parse XML
          bandit -q -r scripts/ -s B101,B110,B112,B310,B406
          echo "bandit clean"

      - name: Actions are pinned to a commit SHA
        run: |
          bad="$(grep -RhoE 'uses: [^ ]+@[A-Za-z0-9._/-]+' .github/workflows | sed -E 's/[[:space:]]+#.*//' | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$bad" ]; then echo "Unpinned actions:"; echo "$bad"; exit 1; fi
          echo "all actions SHA-pinned"

      - name: Line endings (no CRLF)
        run: |
          if grep -rlP --exclude-dir=node_modules '\r$' --include='*.py' --include='*.html' --include='*.md' --include='*.json' --include='*.yml' .; then
            echo "CRLF found"; exit 1
          fi
          echo "LF ok"

  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Required files
        run: |
          for f in README.md LICENSE VERSION index.html report.html assets/app.js assets/app.css assets/report.css assets/stats.js stats.html feed.xml og-image.png CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md CITATION.cff data/seeds.json data/radar.schema.json data/curated.json docs/METHODOLOGY.md docs/DATA_MODEL.md docs/THREAT_MODEL.md docs/INCIDENT_RESPONSE.md docs/RETENTION.md docs/SBOM.md .github/dependabot.yml .github/workflows/health.yml .github/workflows/pages.yml .nojekyll tests/ui_smoke.mjs scripts/validate_payload.py scripts/publish_stats_issue.py scripts/health_check.py scripts/build_ecosystem_manifest.py scripts/build_exports.py data/curated.json support.html assets/support.css assets/support.js assets/doge-qr.svg data/ecosystem-registry.json .github/FUNDING.yml scripts/interop.py data/interop-vocab.json scripts/check_methodology.py tests/test_interop.py tests/test_ecosystem_manifest.py tests/test_exports.py tests/test_stats_issue.py tests/test_signals.py tests/test_api_index.py tests/test_badges.py scripts/build_signals.py scripts/build_api_index.py scripts/sync_engine_data.py docs/API.md docs/BADGES.md data/signals.schema.json data/trajectory.schema.json .github/workflows/sync.yml scripts/build_badges.py scripts/build_trajectory.py scripts/build_talent.py tests/test_trajectory_build.py tests/test_talent.py tests/test_sync_gate.py data/talent.schema.json scripts/check_provenance.py tests/test_provenance.py docs/PROVENANCE.md .github/workflows/scorecard.yml; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "all required files present"

      - name: Workflows reference only files that exist
        # Regression gate. The 8.0.0 slimming deleted scripts that pages.yml and
        # health.yml still call at deploy time: CI stayed green while the site
        # deploy broke, because CI only ran what CI itself listed. Every
        # scripts/* referenced by an ACTIVE workflow (*.yml — .disabled files are
        # inert by design) must exist in the tree.
        run: |
          missing=0
          for f in $(grep -rhoE 'scripts/[A-Za-z0-9_./-]+\.(py|sh)' .github/workflows/*.yml | sort -u); do
            [ -f "$f" ] || { echo "MISSING: $f — referenced by an active workflow"; missing=1; }
          done
          [ "$missing" = "0" ] && echo "every script referenced by an active workflow exists"
          exit "$missing"

      - name: Docs don't reference things the 8.0.0 cutover deleted
        # Regression gate for a pattern that recurred six separate times across
        # four audit passes (report.html's header AND footer, SECURITY.md,
        # THREAT_MODEL.md, CONTRIBUTING.md, docs/RETENTION.md, index.html's live
        # "publish" button, docs/SBOM.md) before this check existed: prose,
        # tables and hrefs kept citing the pre-cutover scanner script and its
        # workflow — both retired at the open-core cutover — or linking the engine's
        # nonexistent Pages site, long after the code had moved on. CHANGELOG.md
        # is exempt: it's a historical record and those mentions were true when
        # written. sync_engine_data.py is exempt: it's the one place these exact
        # strings are supposed to appear, as the literal pattern its own
        # self-healing report.html correction searches for.
        run: |
          bad=0
          hits=$(grep -rn 'scripts/radar\.py' --include='*.md' --include='*.html' . \
                 | grep -v '^\./CHANGELOG.md' || true)
          [ -n "$hits" ] && { echo "$hits" | sed 's/^/DEAD REFERENCE (deleted at 8.0.0): /'; bad=1; }

          hits=$(grep -rn 'workflows/radar\.yml' --include='*.md' --include='*.html' . \
                 | grep -v '^\./CHANGELOG.md' | grep -v 'disabled' || true)
          [ -n "$hits" ] && { echo "$hits" | sed 's/^/DEAD WORKFLOW REFERENCE (retired at 8.0.0, only radar.yml.disabled remains): /'; bad=1; }

          hits=$(grep -rln 'axonos-bci\.github\.io/axonos-radar-core' --include='*.md' --include='*.html' . \
                 | grep -v '^\./CHANGELOG.md' || true)
          [ -n "$hits" ] && { echo "$hits" | sed 's/^/WRONG PAGES URL (axonos-radar-core has no public site): /'; bad=1; }

          [ "$bad" = "0" ] && echo "no dead post-cutover references found"
          exit "$bad"

      - name: Funding consistency (ONE DOGE address, checksum-verified, everywhere)
        # The single-source rule for the support address. Guards against a
        # typo'd or swapped address ever shipping on any surface: the registry
        # is canonical; app.js, support.html, FUNDING.yml and the QR alt-text
        # must all carry exactly it — and it must pass Base58Check (0x1E).
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          ALPH='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          def b58check(s):
              n=0
              for ch in s: n=n*58+ALPH.index(ch)
              raw=n.to_bytes(25,'big')
              return raw[0]==0x1E and hashlib.sha256(hashlib.sha256(raw[:-4]).digest()).digest()[:4]==raw[-4:]
          # payment.json is the root. This gate used to read the address out
          # of ecosystem-registry.json while the support tests read it out of
          # payment.json — two roots of truth for an irreversible transfer,
          # agreeing today because nothing had yet made them disagree.
          pay=json.load(open('data/payment.json'))
          reg=json.load(open('data/ecosystem-registry.json'))['funding']
          assert reg['address']==pay['address'], (
              'ecosystem-registry.json has drifted from data/payment.json: '
              f"{reg['address']} vs {pay['address']}")
          reg=pay
          addr=reg['address']
          assert b58check(addr), 'registry DOGE address fails Base58Check'
          assert reg['uri']==f'dogecoin:{addr}' and addr in reg['explorer']
          for path in ('assets/app.js','support.html','.github/FUNDING.yml'):
              body=open(path,encoding='utf-8').read()
              assert addr in body, f'{path} missing canonical address'
              others=set(re.findall(r'\bD[1-9A-HJ-NP-Za-km-z]{25,40}\b',body))-{addr}
              assert not others, f'{path} carries a FOREIGN D-address: {others}'
          print(f'funding consistency ok: {addr} (Base58Check valid, single-source)')
          PY

      - name: Version consistency (VERSION == badge == CITATION == bibtex == CHANGELOG)
        run: |
          python3 - <<'PY'
          import re, sys
          v = open("VERSION").read().strip()
          # A live count frozen into the README is a claim that quietly stops
          # being true: the map is rescored every three hours, so "120+ BCI
          # projects" on a static badge and "31 near misses" in a diagram are
          # right on the morning they are written and wrong by the evening.
          import re as _re
          _rd = open("README.md", encoding="utf-8").read()
          _frozen = []
          for _m in _re.finditer(r"img\.shields\.io/badge/[^)\s]*?(\d{2,5})%2B?%20(?:BCI%20)?projects", _rd):
              _frozen.append("static badge claiming " + _m.group(1) + " projects")
          for _m in _re.finditer(r"(?<![\w.])(\d{2,4})\s+near\s+miss", _rd):
              _frozen.append("prose claiming " + _m.group(1) + " near misses")
          if _frozen:
              for _f in _frozen:
                  print("::error::the README freezes a live count: " + _f)
              raise SystemExit(1)
          print("no live count is frozen into the README")

          # The funnel counts gate-admitted repositories apart from the
          # ecosystem anchors. The prose has to keep saying so: "kept only if
          # its BRS clears the gate" was true of the rule and false of the map,
          # and it stayed on the page while four unscored AxonOS repositories
          # sat inside the number labelled as having cleared it.
          import json as _json, pathlib as _pl
          _anch = set((_json.loads(_pl.Path("data/curated.json").read_text())
                       .get("_anchors") or {}).keys())
          _proj = _json.loads(_pl.Path("data/radar.json").read_text())["projects"]
          _forced = [p["full_name"] for p in _proj if p.get("ecosystem")]
          if _forced:
              for _doc in ("README.md", "docs/METHODOLOGY.md"):
                  _t = _pl.Path(_doc).read_text(encoding="utf-8")
                  if "ecosystem anchor" not in _t.lower():
                      print(f"::error::{_doc} does not mention the ecosystem anchors, "
                            f"and {len(_forced)} repositories are in the map as one")
                      raise SystemExit(1)
                  # Checking that a disclosure EXISTS is not the same as
                  # checking that the contradiction is ABSENT, and 16.2.0
                  # shipped with only the first. The README said "ecosystem
                  # anchors" three hundred lines down and "Every project here
                  # cleared a scored gate" in its opening sentence; this gate
                  # passed on the former and never looked at the latter. A
                  # reader stops at the opening sentence.
                  # Anchored, not substring. The first version of this list
                  # flagged its own fix: "Almost every project here cleared a
                  # scored gate" contains "every project here cleared a scored
                  # gate", so the corrected sentence failed the check written to
                  # enforce it. A qualifier in front of a claim changes the
                  # claim, and a checker that cannot see the qualifier is
                  # reading letters rather than meaning.
                  _contradictions = [
                      r"kept only if its BRS clears the gate",
                      r"(?<!almost )every project here cleared a scored gate",
                      r"(?<!almost )every project cleared the gate",
                      r"(?<!almost )all projects here cleared",
                  ]
                  for _bad in _contradictions:
                      if _re.search(_bad, _t, _re.I):
                          print(f"::error::{_doc} still claims a universal gate: {_bad!r}")
                          raise SystemExit(1)
              print(f"{len(_forced)} ecosystem anchors in the map, named in the docs")
          else:
              print("no force-included projects in the payload")

          readme = open("README.md", encoding="utf-8").read()
          cff = open("CITATION.cff", encoding="utf-8").read()
          chlog = open("CHANGELOG.md", encoding="utf-8").read()
          errs = []
          if f"version-{v}-" not in readme: errs.append(f"README badge != {v}")
          m = re.search(r"version = \{([^}]+)\}", readme)
          if not m or m.group(1) != v: errs.append(f"README bibtex {m.group(1) if m else '?'} != {v}")
          m = re.search(r"^version: (.+)$", cff, re.M)
          if not m or m.group(1).strip() != v: errs.append(f"CITATION.cff != {v}")
          m = re.search(r"^## \[([0-9.]+)\]", chlog, re.M)
          if not m or m.group(1) != v: errs.append(f"CHANGELOG top {m.group(1) if m else '?'} != {v}")
          for page in ("index.html", "stats.html"):
              if f"v{v}" not in open(page, encoding="utf-8").read():
                  errs.append(f"{page} footer chip != v{v}")
          if errs: print("\n".join(errs)); sys.exit(1)
          print(f"version {v} consistent across VERSION/README badge/bibtex/CITATION/CHANGELOG")
          PY

      - name: The project cards match what the repositories say
        # The stage badges were hand-written and drifted: the radar read Beta at
        # 14.0.0 after three months of running, and five cards pointed at the
        # string "1" instead of a URL. Changing the labels would have fixed one
        # day; a fact about a repository was being asserted where the repository
        # cannot reach.
        #
        # This regenerates and diffs. It does not rewrite during deploy: that
        # would change the artefact without changing the commit, and the commit
        # would stop describing what is published.
        #
        # One card is this repository's own, and that card cannot be validated
        # before the push. The gate reads the *live* repositories, so until the
        # bump is published the live radar still states the old version and
        # agrees with the stale card; the two disagree the moment the push
        # lands. A self-referential version bump is therefore a two-step
        # operation: push the bump, then regenerate the cards against the
        # repository as it now is. Regenerating first proves nothing, and a
        # green local run before such a push is not evidence.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html /tmp/index.before
          python3 scripts/build_project_cards.py --write index.html || {
            echo "::warning::could not read every repository; the cards are unchecked this run"
            cp /tmp/index.before index.html
            exit 0
          }
          diff -q /tmp/index.before index.html || {
            echo "::error::the project cards disagree with the repositories."
            echo "Run: python3 scripts/build_project_cards.py --write index.html"
            echo "If the only disagreement is this repository's own card, this run"
            echo "follows a version bump and the regeneration step is still owed:"
            echo "the card could not have been correct until the bump was pushed."
            diff /tmp/index.before index.html | head -20
            exit 1
          }
          echo "  cards agree with every repository"

      - name: The QR code decodes to the canonical payment URI
        # Mandatory, and it fails if the decoder is missing rather than
        # skipping. 16.3.0 shipped a check with "QR" in its name that read the
        # alt attribute in the HTML and never opened the image, and a release
        # note saying a swapped QR fails the suite. It did not. The image is
        # decoded here, and a decode that cannot run is a failure, not a pass.
        run: |
          pip install -r requirements-ci.txt --quiet --break-system-packages
          python3 -c "import cv2; print('decoder', cv2.__version__)"
          python3 -m pytest tests/test_qr_integrity.py -q

      - name: The payment address and the prices match their contracts
        # A Dogecoin transaction is irreversible. An address wrong by one
        # character in the QR, the URI or the copy button sends a stranger's
        # money somewhere nobody controls, and nothing on the page would look
        # wrong. The prices have already drifted three times on their own.
        # Both are data with a test now, checked on every push.
        run: |
          pip install -r requirements-ci.txt --quiet --break-system-packages
          python3 -m pytest tests/test_support_contract.py -q

      - name: The social card matches its generator
        # The card used to be a committed binary with no source, which is how
        # it went on advertising a six-hour refresh while everything else said
        # three. Regenerating it here and comparing bytes means the text on the
        # image is checked like any other claim in this repository.
        run: |
          # Pinned, from the file that holds the other pins. It was a bare
          # `pip install pillow`, which is the unpinned-scanner defect: the gate
          # would have changed behaviour under the repository whenever Pillow
          # released, and a drawing change would have read as a broken card.
          pip install -r requirements-ci.txt --quiet --break-system-packages
          python3 scripts/build_og_image.py --check

      - name: Licence sanity (MIT text intact)
        run: |
          grep -q "MIT License" LICENSE && grep -q "Denis Yermakou" LICENSE || { echo "LICENSE malformed"; exit 1; }
          echo "LICENSE ok"


